<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#bgGrad)" />

  <!-- Soft Glow Inner Ring -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" />

  <!-- Body / Professional Suit -->
  <path d="M30 160 C32 120 48 114 80 114 C112 114 128 120 130 160 Z" fill="url(#suitGrad)" />
  <path d="M68 114 L80 132 L92 114 Z" fill="#ffffff" />
  <path d="M77 122 L80 144 L83 122 Z" fill="#0284c7" />

  <!-- Neck -->
  <rect x="71" y="92" width="18" height="24" rx="4" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="80" cy="74" rx="26" ry="30" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M52 70 C52 46 64 36 80 36 C96 36 108 46 108 70 C108 75 106 82 104 82 C101 70 98 48 80 48 C62 48 59 70 56 82 C54 82 52 75 52 70 Z" fill="url(#hairGrad)" />

  <!-- Eyes -->
  <ellipse cx="69" cy="72" rx="3" ry="3.5" fill="#0f172a" />
  <ellipse cx="91" cy="72" rx="3" ry="3.5" fill="#0f172a" />
  <circle cx="70" cy="71" r="1" fill="#ffffff" />
  <circle cx="92" cy="71" r="1" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M64 64 Q69 61 74 64" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
  <path d="M86 64 Q91 61 96 64" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />

  <!-- Gentle Smile -->
  <path d="M73 85 Q80 91 87 85" fill="none" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round" />

  <!-- Headset for AI Interview -->
  <path d="M50 72 C50 48 60 40 80 40 C100 40 110 48 110 72" fill="none" stroke="url(#headsetGrad)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Ear pads -->
  <rect x="47" y="66" width="7" height="15" rx="3.5" fill="#0284c7" />
  <rect x="106" y="66" width="7" height="15" rx="3.5" fill="#0284c7" />
  <!-- Mic boom -->
  <path d="M51 77 Q56 94 72 94" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="73" cy="94" r="3" fill="#38bdf8" />
</svg>
